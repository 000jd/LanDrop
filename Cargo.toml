[workspace]
members = ["desktop"]

[package]
name = "landrop"
version = "0.1.0"
edition = "2021"
# Practical floor, measured: locked dependencies (icu_* via url, idna_adapter)
# need 1.86; the hand-written code itself compiles on much older toolchains.
# Verified locally with `cargo +1.86.0 check --locked --all-targets` and by the
# `msrv` job in CI.
rust-version = "1.86"
description = "LanDrop — LAN file sharing with no cloud and no accounts"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
dirs = "5"
mdns-sd = "0.13"
nix = { version = "0.29", features = ["net", "hostname", "fs"] }
socket2 = { version = "0.5", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"
bytes = "1"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util"] }

[profile.release]
lto = true
strip = true
