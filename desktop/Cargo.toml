[package]
name = "landrop-desktop"
version = "0.1.0"
edition = "2021"
description = "LanDrop app (Tauri v2) — desktop window + Android/iOS entry"
license = "MIT"

[lib]
# Mobile targets load the app as a library; the desktop binary links the same
# code through the rlib. This is the standard Tauri v2 mobile layout.
name = "landrop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
landrop = { path = ".." }
